services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: guest_guide
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide -d guest_guide"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: guest-guide-migrate:latest
    restart: "no"
    environment:
      DATABASE_URL: postgresql://guide:${POSTGRES_PASSWORD}@db:5432/guest_guide
    depends_on:
      db:
        condition: service_healthy

  app:
    image: guest-guide:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://guide:${POSTGRES_PASSWORD}@db:5432/guest_guide
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-5.4-mini}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
